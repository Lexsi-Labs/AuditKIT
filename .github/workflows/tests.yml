name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Some tests load small Hugging Face models; cache them so shared runner IPs hit the rate limit less.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-hub-auditkit-v1

      # The CPU torch wheel keeps the install small; the transformers extra is what the metric and backend tests need.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[dev,transformers]" pytest-rerunfailures

      - name: Run tests
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -m pytest --reruns 2 --reruns-delay 10 --only-rerun "OSError" --only-rerun "ConnectionError"
